<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Light">
<meta name="theme-color" content="#140d17">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Red Light</title>
<style>
  :root {
    --bg: #f7f3f5; --card: #ffffff; --ink: #1d1420; --muted: #7a6d7e; --line: #ece4ea;
    --red: #e5484d; --red-soft: #fde8e8; --green: #1f9d55; --green-soft: #e3f5ea;
    --amber: #b7791f; --amber-soft: #fbf1dc; --accent: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #140d17; --card: #1f1623; --ink: #f4ecf5; --muted: #a596a9; --line: #2e2333;
      --red-soft: #3a1a1f; --green: #4cc382; --green-soft: #15301f; --amber: #e2b45c; --amber-soft: #33281a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 28px; font-weight: 750; letter-spacing: -.02em; margin: 0; flex: 1; }
  .status { font-size: 12px; color: var(--muted); text-align: right; }
  .status b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: 1px; }
  .status.live b { background: var(--green); }
  .icon-btn { border: 0; background: var(--card); color: var(--ink); width: 38px; height: 38px; border-radius: 50%;
    font-size: 18px; box-shadow: 0 1px 0 var(--line); }
  main { padding: 0 16px; }
  .chips { display: flex; gap: 8px; margin: 2px 0 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 4px 8px; font-weight: 650; }
  .card { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
    display: grid; grid-template-columns: 54px 1fr auto; gap: 4px 12px; align-items: center;
    border: 1px solid var(--line); }
  .card.dim { opacity: .5; }
  .time { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .meta { grid-column: 2 / 3; font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .pill.free { background: var(--green-soft); color: var(--green); }
  .pill.full { background: var(--red-soft); color: var(--red); }
  .pill.busy { background: var(--amber-soft); color: var(--amber); }
  .actions { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .btn { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 650; font-size: 14px; min-width: 92px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--muted); padding: 4px 8px; font-weight: 500; font-size: 13px; }
  .btn.danger { background: var(--red-soft); color: var(--red); }
  .btn[disabled] { opacity: .5; }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: space-around;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; }
  nav button span { font-size: 22px; line-height: 1; }
  nav button[aria-current="page"] { color: var(--accent); }
  .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: 10px; padding: 0 5px; margin-left: 2px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 9;
    background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px;
    transform: translateY(20px); opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { transform: none; opacity: 1; }
  .setup { background: var(--card); border-radius: 16px; padding: 18px; border: 1px solid var(--line); margin-top: 12px; }
  .setup input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font-size: 15px; margin: 10px 0; }
  .search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 16px; margin: 2px 0 10px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; color: var(--ink); font-size: 16px; }
  .row .grow { flex: 1; font-weight: 600; }
  .row .sub { font-size: 12px; color: var(--muted); font-weight: 500; }
  .back { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 6px 0 2px; font-weight: 600; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { font-size: 13px; color: var(--muted); margin: 10px 4px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Red Light</h1>
  <div class="status" id="status"><b></b>—</div>
  <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="spots" aria-current="page"><span>🔴</span>Red Light</button>
  <button data-tab="studios"><span>🏃</span>Studios</button>
  <button data-tab="specials"><span>✨</span>Specials</button>
  <button data-tab="mine"><span>📅</span>My bookings<i class="badge" id="mineCount" hidden></i></button>
</nav>
<div class="toast" id="toast"></div>

<script>
/*
  Red Light — a tiny front end for the Wellpass monitor that runs on the VM.
  The phone can't reach the VM, so both talk through two private ntfy.sh topics:
    data  (VM → app): a compact JSON snapshot, re-published whenever something changes
    reply (app → VM): commands "book <class>", "cancel <booking>", "ignore <class>", "unignore <class>", "refresh"
  The topic names live only in this device's storage (they arrive in the link's #fragment,
  which browsers never send to the server).
*/
const NTFY = 'https://ntfy.sh';
const DIAS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DIAS_LARGO = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const $ = (s) => document.querySelector(s);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// first open: topics come in the #fragment, then are kept on this device
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('d') && hash.get('r')) { store.set('d', hash.get('d')); store.set('r', hash.get('r')); }
const cfg = { d: store.get('d') || hash.get('d'), r: store.get('r') || hash.get('r') };

let snap = null, tab = 'spots', filter = store.get('filter') || 'fits', pending = {};
let favs = JSON.parse(store.get('favs') || 'null');            // {at, g: [[slug, name], ...]}
let studios = JSON.parse(store.get('studios') || '{}');        // slug -> {n, at, c: [[id, start, name, booked, cap]], t}
let studio = null, query = '', asked = {};                     // open studio slug, search text, slug -> time asked

const parseLocal = (s) => { const [d, t] = s.split('T'); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, dd, h, mi); };
const hhmm = (s) => s.slice(11, 16);
const dayKey = (s) => s.slice(0, 10);
const dayLabel = (s) => {
  const d = parseLocal(s), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 864e5);
  const base = `${DIAS_LARGO[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}`;
  return diff === 0 ? `Today · ${base}` : diff === 1 ? `Tomorrow · ${base}` : base;
};
const shortDay = (s) => { const d = parseLocal(s); return `${DIAS[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}`; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms);
}

async function send(cmd, label) {
  try {
    const r = await fetch(`${NTFY}/${cfg.r}`, { method: 'POST', body: cmd });
    if (!r.ok) throw new Error(r.status);
    toast(label);
  } catch (e) {
    toast('Couldn’t send. Are you online?');
  }
}

function setStatus() {
  const el = $('#status');
  if (!snap) { el.className = 'status'; el.innerHTML = '<b></b>waiting for data…'; return; }
  const age = (Date.now() - parseLocal(snap.at)) / 6e4;
  el.className = 'status' + (age < 20 ? ' live' : '');
  el.innerHTML = `<b></b>${age < 1 ? 'just now' : age < 60 ? `${Math.round(age)} min ago` : Math.round(age / 60) + ' h ago'}`;
}

function render() {
  setStatus();
  const main = $('#main');
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const mine = snap?.mine || [];
  const mc = $('#mineCount'); mc.hidden = !mine.length; mc.textContent = mine.length;

  if (!cfg.d || !cfg.r) return renderSetup(main);
  if (!snap) { main.innerHTML = '<p class="empty">Loading…<br><br>If it takes a while, tap ↻ — the VM answers in about 20 seconds.</p>'; return; }

  const bookedIds = new Set(mine.map((m) => m[1]));
  if (tab === 'studios') return renderStudios(main, bookedIds);
  if (tab === 'spots') {
    $('#title').textContent = 'Red Light';
    let rows = snap.spots;
    if (filter === 'fits') rows = rows.filter((s) => s[5] && !s[6]);
    if (filter === 'free') rows = rows.filter((s) => s[4] - s[3] > 0 && !s[6]);
    let html = `<div class="chips">
      <button class="chip" data-filter="fits" aria-pressed="${filter === 'fits'}">Fits my calendar</button>
      <button class="chip" data-filter="free" aria-pressed="${filter === 'free'}">Spots free</button>
      <button class="chip" data-filter="all" aria-pressed="${filter === 'all'}">All</button></div>`;
    if (!rows.length) html += '<p class="empty">Nothing here with this filter.</p>';
    let day = '';
    for (const [id, name, start, booked, cap, fits, ignored] of rows) {
      if (dayKey(start) !== day) { day = dayKey(start); html += `<h2>${dayLabel(start)}</h2>`; }
      const free = cap - booked, mineHere = bookedIds.has(id), wait = pending[id];
      html += `<div class="card${ignored ? ' dim' : ''}">
        <div class="time">${hhmm(start)}</div>
        <div class="name">${esc(name)}</div>
        <div class="actions">${
          mineHere ? '<span class="pill free">Booked</span>'
          : `<button class="btn primary" data-book="${id}" ${wait ? 'disabled' : ''}>${wait ? 'Sent…' : free > 0 ? 'Book' : 'Waitlist'}</button>`
        }<button class="btn ghost" data-${ignored ? 'unignore' : 'ignore'}="${id}">${ignored ? 'Watch again' : 'Ignore'}</button></div>
        <div class="meta">${free > 0 ? `<span class="pill free">${free} free</span>` : '<span class="pill full">Full</span>'}
          ${fits ? '' : '<span class="pill busy">Clashes with calendar</span>'}<span>${booked}/${cap}</span></div>
      </div>`;
    }
    html += '<p class="note">Session München · red light classes cost +10 € with Wellpass. Free cancellation up to 12 h before.</p>';
    main.innerHTML = html;
  }

  if (tab === 'specials') {
    $('#title').textContent = 'Specials';
    const rows = snap.specials || [];
    let html = rows.length ? '' : '<p class="empty">No upcoming specials at your favourite studios.<br><br>Checked every hour.</p>';
    let day = '';
    for (const [id, start, gym, name, booked, cap] of rows) {
      if (dayKey(start) !== day) { day = dayKey(start); html += `<h2>${dayLabel(start)}</h2>`; }
      const free = cap - booked, wait = pending[id];
      html += `<div class="card">
        <div class="time">${hhmm(start)}</div>
        <div class="name">${esc(name)}</div>
        <div class="actions">${bookedIds.has(id) ? '<span class="pill free">Booked</span>'
          : `<button class="btn primary" data-book="${id}" ${wait ? 'disabled' : ''}>${wait ? 'Sent…' : free > 0 ? 'Book' : 'Waitlist'}</button>`}</div>
        <div class="meta"><span>${esc(gym)}</span><span>· ${booked}/${cap}</span></div>
      </div>`;
    }
    main.innerHTML = html;
  }

  if (tab === 'mine') {
    $('#title').textContent = 'My bookings';
    let html = mine.length ? '' : '<p class="empty">No upcoming bookings.</p>';
    for (const [bid, cid, start, name, gym, status] of mine) {
      const hoursLeft = (parseLocal(start) - Date.now()) / 36e5, wait = pending[bid];
      html += `<div class="card">
        <div class="time">${hhmm(start)}</div>
        <div class="name">${esc(name)}</div>
        <div class="actions"><button class="btn danger" data-cancel="${bid}" data-late="${hoursLeft < 12 ? 1 : 0}" ${wait ? 'disabled' : ''}>${wait ? 'Sent…' : 'Cancel'}</button></div>
        <div class="meta"><span>${shortDay(start)}</span><span>· ${esc(gym)}</span>${status === 'WAITING_LIST' ? '<span class="pill busy">Waitlist</span>' : ''}
          ${hoursLeft < 12 ? '<span class="pill full">&lt;12 h: cancelling costs 5 €</span>' : ''}</div>
      </div>`;
    }
    main.innerHTML = html;
  }
}

function renderStudios(main, bookedIds) {
  if (!studio) {
    $('#title').textContent = 'Studios';
    if (!favs) {
      if (!asked.favs) { asked.favs = Date.now(); send('favs', 'Fetching your favourite studios…'); }
      main.innerHTML = '<p class="empty"><span class="spinner"></span>Loading your favourites… (~20 s)</p>';
      return;
    }
    const q = query.toLowerCase();
    const list = favs.g.filter(([, n]) => !q || n.toLowerCase().includes(q));
    let html = `<input class="search" id="q" placeholder="Search studios" value="${esc(query)}" autocomplete="off">`;
    for (const [slug, name] of list) {
      const c = studios[slug];
      const sub = c ? (c.c.length ? `${c.c.length} classes this week` : 'no bookable classes') : '';
      html += `<button class="row" data-studio="${slug}"><span class="grow">${esc(name)}<br><span class="sub">${sub}</span></span><span>›</span></button>`;
    }
    if (!list.length) html += '<p class="empty">No favourite with that name.</p>';
    html += '<p class="note">Your Wellpass favourites. To change them, tap ♡ in the Wellpass app.</p>';
    main.innerHTML = html;
    const qi = $('#q'); qi.oninput = () => { query = qi.value; const pos = qi.selectionStart; renderStudios(main, bookedIds); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
    return;
  }
  const name = (favs?.g.find((f) => f[0] === studio) || [, studio])[1];
  $('#title').textContent = 'Studios';
  const c = studios[studio];
  const stale = !c || (Date.now() - parseLocal(c.at)) / 6e4 > 10;
  if (stale && (!asked[studio] || Date.now() - asked[studio] > 60000)) { asked[studio] = Date.now(); send(`studio ${studio}`, 'Fetching the schedule… (~20 s)'); }
  let html = `<button class="back" data-back="1">‹ All</button><h3 style="margin:4px 4px 0;font-size:20px">${esc(name)}</h3>`;
  if (!c) { main.innerHTML = html + '<p class="empty"><span class="spinner"></span>Asking the VM for the schedule…<br>Takes about 20 seconds.</p>'; return; }
  if (stale) html += '<p class="note"><span class="spinner"></span>Updating…</p>';
  if (!c.c.length) html += '<p class="empty">This studio has no bookable classes in the app (check-in only).</p>';
  let day = '';
  for (const [id, start, cname, booked, cap] of c.c) {
    if (dayKey(start) !== day) { day = dayKey(start); html += `<h2>${dayLabel(start)}</h2>`; }
    const free = cap - booked, wait = pending[id];
    html += `<div class="card">
      <div class="time">${hhmm(start)}</div>
      <div class="name">${esc(cname)}</div>
      <div class="actions">${bookedIds.has(id) ? '<span class="pill free">Booked</span>'
        : `<button class="btn primary" data-book="${id}" ${wait ? 'disabled' : ''}>${wait ? 'Sent…' : free > 0 ? 'Book' : 'Waitlist'}</button>`}</div>
      <div class="meta">${free > 0 ? `<span class="pill free">${free} free</span>` : '<span class="pill full">Full</span>'}<span>${booked}/${cap}</span></div>
    </div>`;
  }
  if (c.t) html += '<p class="note">Only the first days fit in one message; see the Wellpass app for more.</p>';
  html += '<p class="note">"(+€)" = surcharge for Wellpass members. Max. 1 booking per day and studio.</p>';
  main.innerHTML = html;
}

function renderSetup(main) {
  $('#title').textContent = 'Red Light';
  main.innerHTML = `<div class="setup"><b>The app isn’t connected yet</b>
    <p class="note">Open this page from the link in your notification (the one ending in <code>#d=…&amp;r=…</code>), or paste it here:</p>
    <input id="link" placeholder="https://…#d=…&r=…" autocomplete="off">
    <button class="btn primary" id="save">Connect</button></div>`;
  $('#save').onclick = () => {
    const h = new URLSearchParams(($('#link').value.split('#')[1] || ''));
    if (h.get('d') && h.get('r')) { store.set('d', h.get('d')); store.set('r', h.get('r')); location.hash = ''; location.reload(); }
    else toast('That link doesn’t contain the connection details.');
  };
}

$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.studio) { studio = b.dataset.studio; window.scrollTo(0, 0); return render(); }
  if (b.dataset.back) { studio = null; return render(); }
  if (b.dataset.filter) { filter = b.dataset.filter; store.set('filter', filter); return render(); }
  if (b.dataset.book) {
    pending[b.dataset.book] = Date.now(); render();
    return send(`book ${b.dataset.book}`, 'Booking… confirmation arrives in ~20 s');
  }
  if (b.dataset.cancel) {
    const late = b.dataset.late === '1';
    if (!confirm(late ? 'Less than 12 h to go: cancelling now costs 5 €. Cancel anyway?' : 'Cancel this booking?')) return;
    pending[b.dataset.cancel] = Date.now(); render();
    return send(`cancel ${b.dataset.cancel}`, 'Cancelling…');
  }
  if (b.dataset.ignore) { mark(b.dataset.ignore, 1); return send(`ignore ${b.dataset.ignore}`, 'You won’t be alerted for this class'); }
  if (b.dataset.unignore) { mark(b.dataset.unignore, 0); return send(`unignore ${b.dataset.unignore}`, 'Watching this class again'); }
});
function mark(id, v) { const r = snap?.spots.find((s) => s[0] === id); if (r) { r[6] = v; render(); } }

$('#nav').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (tab === b.dataset.tab && tab === 'studios') studio = null;
  tab = b.dataset.tab; window.scrollTo(0, 0); render();
});
$('#refresh').onclick = () => {
  if (!cfg.r) return;
  if (tab === 'studios' && studio) { asked[studio] = Date.now(); send(`studio ${studio}`, 'Fetching the schedule… (~20 s)'); }
  else if (tab === 'studios' && !favs) send('favs', 'Fetching your favourites…');
  else send('refresh', 'Asking for fresh data…');
  load();
};

function accept(msg) {
  try {
    const s = JSON.parse(msg);
    if (s.k === 'favs') { if (!favs || s.at >= favs.at) { favs = s; store.set('favs', JSON.stringify(s)); render(); } return; }
    if (s.k === 'studio') {
      if (!studios[s.s] || s.at >= studios[s.s].at) { studios[s.s] = s; store.set('studios', JSON.stringify(studios)); render(); }
      return;
    }
    if (s.v !== 1) return;
    if (!snap || s.at >= snap.at) {
      snap = s;
      // drop "Enviado…" once the VM has had time to act (or the new snapshot shows it done)
      for (const k in pending) if (Date.now() - pending[k] > 25000) delete pending[k];
      store.set('snap', msg);
      render();
    }
  } catch {}
}

async function load() {
  if (!cfg.d) return render();
  try {
    const r = await fetch(`${NTFY}/${cfg.d}/json?poll=1&since=12h`);
    const msgs = (await r.text()).trim().split('\n').filter(Boolean).map((l) => JSON.parse(l)).filter((m) => m.event === 'message');
    for (const m of msgs) accept(m.message);
    if (!msgs.length) render();
  } catch { render(); }
}

let es;
function live() {
  if (!cfg.d || es) return;
  es = new EventSource(`${NTFY}/${cfg.d}/sse`);
  es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === 'message') accept(m.message); } catch {} };
  es.onerror = () => { es.close(); es = null; setTimeout(live, 5000); };
}

const cached = store.get('snap'); if (cached) accept(cached);
render(); load(); live();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); live(); } });
setInterval(setStatus, 30000);
</script>
