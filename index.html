<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MoveList">
<meta name="theme-color" content="#1a0d1b">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>MoveList</title>
<style>
  :root {
    --bg: #fff6f9; --bg-glow: rgba(255, 105, 160, .16); --bg-glow-2: rgba(182, 140, 255, .14);
    --card: #ffffff; --card-2: #fdeef4; --ink: #3a1630; --muted: #a07a92; --line: rgba(196, 70, 130, .10);
    --accent: #f2558f; --accent-2: #ff9bbd; --accent-ink: #ffffff; --accent-soft: rgba(242, 85, 143, .12);
    --lilac: #a989f5; --lilac-soft: rgba(169, 137, 245, .14);
    --green: #22a876; --green-soft: rgba(34, 168, 118, .12);
    --amber: #e07a3f; --amber-soft: rgba(224, 122, 63, .13);
    --shadow: 0 1px 2px rgba(196, 70, 130, .06), 0 8px 22px rgba(196, 70, 130, .10);
    --radius: 24px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a0d1b; --bg-glow: rgba(255, 92, 160, .20); --bg-glow-2: rgba(160, 120, 255, .16);
      --card: #261427; --card-2: #331c34; --ink: #ffeef6; --muted: #c49bb5; --line: rgba(255, 170, 210, .10);
      --accent: #ff6ea6; --accent-2: #ffa8c8; --accent-soft: rgba(255, 110, 166, .16);
      --lilac: #c4a8ff; --lilac-soft: rgba(196, 168, 255, .16);
      --green: #5fdcaa; --green-soft: rgba(95, 220, 170, .14);
      --amber: #ffb07a; --amber-soft: rgba(255, 176, 122, .14);
      --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 28px rgba(0, 0, 0, .40);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); min-height: 100vh;
    font: 16px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: radial-gradient(90% 45% at 15% -5%, var(--bg-glow), transparent 70%) no-repeat,
      radial-gradient(80% 40% at 100% 0%, var(--bg-glow-2), transparent 70%) no-repeat, var(--bg);
    padding: env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom)); }
  button { font: inherit; cursor: pointer; }
  button:active { transform: scale(.97); }
  svg { display: block; }

  /* header */
  header { position: sticky; top: 0; z-index: 5; padding: 12px 20px 10px; display: flex; align-items: flex-end; gap: 12px;
    background: linear-gradient(var(--bg) 70%, transparent); }
  .head { flex: 1; min-width: 0; }
  .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; height: 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .live .dot { background: var(--green); box-shadow: 0 0 0 0 var(--green); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(79, 209, 139, .5); } 70% { box-shadow: 0 0 0 7px rgba(79, 209, 139, 0); } 100% { box-shadow: 0 0 0 0 rgba(79, 209, 139, 0); } }
  h1 { background: linear-gradient(100deg, var(--accent), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent;
    font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink);
    display: grid; place-items: center; box-shadow: var(--shadow); flex: none; margin-bottom: 2px; }
  .round.spin svg { animation: spin .8s linear infinite; }
  main { padding: 0 16px; }

  /* segmented filter */
  .seg { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; margin: 4px 0 6px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 7px 4px; border-radius: 9px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

  /* day headings */
  h2 { display: flex; align-items: baseline; gap: 8px; margin: 22px 4px 10px; font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
  h2 small { font-size: 13px; font-weight: 600; color: var(--muted); }
  h2 .today { color: var(--accent); }

  /* class card */
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 14px 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .card.dim { opacity: .45; }
  .card[data-open] { cursor: pointer; }
  .card[data-open]:active { transform: scale(.985); }
  .when { width: 50px; flex: none; }
  .when b { display: block; font-size: 19px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .when span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 650; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 12px; font-weight: 600; }
  .bar { flex: 1; max-width: 90px; height: 5px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--lilac), var(--accent)); }
  .cap.full .bar i { background: var(--muted); }
  .cap.low .bar i { background: var(--amber); }
  .cap em { font-style: normal; color: var(--accent); }
  .cap.full em { color: var(--muted); }
  .cap.low em { color: var(--amber); }
  .tag { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 11.5px; font-weight: 600;
    color: var(--amber); background: var(--amber-soft); padding: 2px 8px; border-radius: 999px; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; min-width: 84px; }
  .btn.primary { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent-2), var(--accent) 55%, #e2468a);
    box-shadow: 0 6px 16px rgba(242, 85, 143, .38); }
  .btn.soft { color: var(--accent); background: var(--accent-soft); }
  .btn.wait { color: var(--ink); background: var(--card-2); }
  .btn[disabled] { opacity: .55; box-shadow: none; }
  .booked { display: inline-flex; align-items: center; gap: 5px; padding: 8px 12px; border-radius: 999px;
    color: var(--green); background: var(--green-soft); font-weight: 700; font-size: 13.5px; }
  .ghost { border: 0; background: none; color: var(--muted); padding: 2px 4px; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }

  /* my bookings */
  .date { width: 52px; flex: none; border-radius: 16px; background: linear-gradient(160deg, var(--accent-soft), var(--lilac-soft)); text-align: center; padding: 6px 0 7px; }
  .date span { display: block; font-size: 10.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .date b { display: block; font-size: 22px; font-weight: 800; line-height: 1.05; }
  .warn { color: var(--accent); font-weight: 600; }

  /* studios */
  .search { position: relative; margin: 4px 0 12px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input { width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px; border: 0; background: var(--card-2);
    color: var(--ink); font-size: 16px; outline: none; }
  .list { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; color: var(--ink);
    text-align: left; padding: 11px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { transform: none; background: var(--card-2); }
  .avatar { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
    font-weight: 800; font-size: 14px; color: #fff; letter-spacing: .02em; }
  .row .body .title { font-size: 15.5px; }
  .chev { color: var(--muted); opacity: .6; }
  .count { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
  .label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 20px 6px 8px; }
  .hero { display: flex; align-items: center; gap: 14px; margin: 4px 2px 6px; }
  .hero .avatar { width: 56px; height: 56px; border-radius: 16px; font-size: 18px; }
  .hero h3 { margin: 0; font-size: 21px; letter-spacing: -.015em; line-height: 1.15; }
  .back { border: 0; background: none; color: var(--accent); font-weight: 650; padding: 4px 0 8px; display: flex; align-items: center; gap: 2px; }

  /* day jump bar */
  .days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 10px -16px 0; padding: 0 16px 2px; position: sticky;
    top: calc(env(safe-area-inset-top) + 74px); z-index: 4; }
  .days::-webkit-scrollbar { display: none; }
  .cats { position: static; margin: 0 -16px 12px; }
  .cats button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .cats button.on small { color: inherit; opacity: .7; }
  .days button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); }
  .days button small { color: var(--muted); font-weight: 600; margin-left: 4px; }
  h2[id] { scroll-margin-top: calc(env(safe-area-inset-top) + 130px); }
  /* pull to refresh */
  .ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 8px); z-index: 7; width: 36px; height: 36px; margin-left: -18px;
    border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--accent);
    transform: translateY(-60px); opacity: 0; transition: opacity .15s; }
  .ptr.ready svg { animation: spin .8s linear infinite; }

  /* home */
  .hello { margin: 2px 4px 14px; color: var(--muted); font-size: 14.5px; font-weight: 600; }
  .next { position: relative; overflow: hidden; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; color: #fff;
    background: linear-gradient(135deg, var(--accent-2), var(--accent) 50%, var(--lilac)); box-shadow: 0 10px 26px rgba(242, 85, 143, .35); cursor: pointer; }
  .next small { font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .next b { display: block; font-size: 21px; margin: 4px 0 2px; letter-spacing: -.01em; }
  .next span { font-size: 14px; opacity: .92; }
  .next .in { position: absolute; right: 16px; top: 16px; background: rgba(255, 255, 255, .22); padding: 4px 10px; border-radius: 999px;
    font-size: 12.5px; font-weight: 750; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); }
  .tile .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .tile .v small { font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 2px; }
  .tile .l { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .tile .e { float: right; font-size: 18px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .panel h5 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h5 small { color: var(--muted); font-weight: 600; font-size: 12px; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; }
  .chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .chart i { width: 100%; max-width: 26px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, var(--accent-2), var(--lilac)); min-height: 4px; }
  .chart i.low { background: var(--card-2); }
  .chart span { font-size: 11px; font-weight: 700; color: var(--muted); }
  .chart .today span { color: var(--accent); }
  .quick { display: flex; gap: 10px; margin-bottom: 14px; }
  .quick button { flex: 1; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 12px 14px;
    box-shadow: var(--shadow); }
  .quick b { display: block; font-size: 22px; font-weight: 800; color: var(--accent); }
  .quick span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .rowline { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14.5px; }
  .rowline + .rowline { border-top: 1px solid var(--line); }
  .rowline span { color: var(--muted); }

  /* misc */
  .empty { text-align: center; color: var(--muted); padding: 56px 24px; }
  .empty .big { font-size: 40px; margin-bottom: 10px; opacity: .8; }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .note { font-size: 12.5px; color: var(--muted); margin: 16px 6px; line-height: 1.45; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .updating { display: flex; align-items: center; font-size: 12.5px; color: var(--muted); margin: 6px 4px 0; }

  /* tab bar */
  nav { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6;
    display: flex; padding: 6px; border-radius: 26px; border: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 8px 30px rgba(0, 0, 0, .18); }
  nav button { position: relative; flex: 1; border: 0; background: none; color: var(--muted); font-size: 10.5px; font-weight: 650;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 20px; }
  nav button[aria-current="page"] { color: var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--lilac-soft)); }
  .badge { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--accent); color: #fff; border-radius: 999px;
    font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; line-height: 17px; padding: 0 4px; font-style: normal; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 9; max-width: calc(100% - 40px);
    background: color-mix(in srgb, var(--ink) 92%, transparent); color: var(--bg); padding: 11px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; transform: translate(-50%, 16px); opacity: 0; transition: .25s; pointer-events: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 4, 12, .45); opacity: 0; transition: opacity .2s;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .scrim.show { opacity: 1; }
  .sheet { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 21;
    background: var(--card); border-radius: 28px; padding: 22px 20px 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    transform: translateY(110%); transition: transform .32s cubic-bezier(.2, .9, .25, 1); text-align: center;
    max-height: calc(88vh - env(safe-area-inset-top)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet.show { transform: none; }
  .sheet-x { position: sticky; top: -8px; float: right; z-index: 2; width: 34px; height: 34px; margin: -10px -8px 0 0;
    border: 0; border-radius: 50%; background: var(--card); color: var(--ink); display: grid; place-items: center;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .15); }
  .sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: -10px auto 14px; }
  .sheet h4 { margin: 6px 0 4px; font-size: 21px; letter-spacing: -.015em; }
  .sheet .lead { color: var(--muted); font-size: 14.5px; margin: 0 8px 14px; }
  .facts { background: var(--card-2); border-radius: 16px; padding: 4px 14px; margin: 0 0 14px; text-align: left; }
  .fact { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 14.5px; }
  .fact + .fact { border-top: 1px solid var(--line); }
  .fact span { color: var(--muted); }
  .fact b { font-weight: 650; text-align: right; }
  .desc { text-align: left; white-space: pre-line; font-size: 14.5px; line-height: 1.5; color: var(--ink);
    background: var(--card-2); border-radius: 16px; padding: 12px 14px; margin: 0 0 14px; }
  .desc.muted { color: var(--muted); }
  .desc.rich { white-space: normal; }
  .desc p { margin: 0 0 10px; } .desc p:last-child { margin-bottom: 0; }
  .desc ul, .desc ol { margin: 0 0 10px; padding-left: 20px; }
  .desc hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .desc strong, .desc b { font-weight: 700; }
  .sheet .full-title { font-size: 20px; line-height: 1.25; margin: 6px 4px 4px; }
  .trip { background: var(--card-2); border-radius: 16px; padding: 4px 14px 8px; margin: 0 0 14px; text-align: left; }
  .trip h6 { margin: 10px 0 0; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .trip .from { padding: 10px 0 4px; }
  .trip .from + .from { border-top: 1px solid var(--line); }
  .trip .head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 750; font-size: 14.5px; margin-bottom: 4px; }
  .trip .head span { font-weight: 600; font-size: 13px; color: var(--muted); }
  .conn { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13.5px; }
  .conn .t { width: 92px; flex: none; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
  .conn .lines { flex: 1; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .conn .m { font-weight: 750; }
  .ln { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 12px; }
  .ln.UBAHN { background: #0065ae; } .ln.BUS, .ln.REGIONAL { background: #00586a; } .ln.TRAM { background: #e30613; }
  .ln.SBAHN { background: #408335; } .ln.BAHN { background: #8a8a8a; }
  .arrow { color: var(--muted); font-size: 11px; }
  .fine { font-size: 12.5px; color: var(--muted); margin: 0 6px 16px; line-height: 1.45; }
  .sheet .buttons { display: flex; gap: 10px; }
  .sheet .buttons .btn { flex: 1; padding: 14px; font-size: 16px; border-radius: 16px; }
  .badge-icon { width: 64px; height: 64px; border-radius: 50%; margin: 2px auto 6px; display: grid; place-items: center; }
  .badge-icon.ok { background: var(--green-soft); color: var(--green); }
  .badge-icon.bad { background: var(--accent-soft); color: var(--accent); }
  .badge-icon.ask { background: var(--accent-soft); color: var(--accent); }
  .badge-icon svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .45s .15s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .setup { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-top: 12px; }
  .setup input { width: 100%; padding: 12px; border-radius: 12px; border: 0; background: var(--card-2); color: var(--ink); font-size: 15px; margin: 10px 0; }
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="eyebrow" id="status"><span class="dot"></span><span id="statusText">—</span></div>
    <h1 id="title">MoveList</h1>
  </div>
  <button class="round" id="refresh" aria-label="Refresh">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="home" aria-current="page">

<script>
/*
  MoveList — a tiny front end for the Wellpass monitor that runs on the VM.
  The phone can't reach the VM, so both talk through two private ntfy.sh topics:
    data  (VM → app): compact JSON snapshots, studio schedules and an hourly bundle (attachment)
    reply (app → VM): "book <class>", "cancel <booking>", "ignore|unignore <class>", "refresh", "studio <slug>", "favs"
  The topic names live only in this device's storage (they arrive in the link's #fragment,
  which browsers never send to the server).
*/
const NTFY = 'https://ntfy.sh';
const VERSION = '2026-10-16.3';  // bump on every publish: open apps notice and reload themselves

// GitHub Pages lets phones cache the page for 10 min; ask past the cache whether a newer one is live
async function checkForUpdate() {
  try {
    const html = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then((r) => r.text());
    const live = (html.match(/const VERSION = '([^']+)'/) || [])[1];
    if (live && live !== VERSION) location.reload();
  } catch {}
}
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const $ = (s) => document.querySelector(s);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// first open: topics come in the #fragment, then are kept on this device
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('d') && hash.get('r')) { store.set('d', hash.get('d')); store.set('r', hash.get('r')); }
const cfg = { d: store.get('d') || hash.get('d'), r: store.get('r') || hash.get('r') };

const lastTab = JSON.parse(store.get('lastTab') || 'null');
let snap = null, tab = lastTab && Date.now() - lastTab.at < 30 * 60000 ? lastTab.tab : 'home', filter = store.get('filter') || 'fits', pending = {};
let stats = JSON.parse(store.get('stats') || 'null');  // hourly overview from the VM
let bundleSpecials = JSON.parse(store.get('bundleSpecials') || '[]');  // full list from the hourly bundle
let favs = JSON.parse(store.get('favs') || 'null');            // {at, g: [[slug, name], ...]}
let studios = JSON.parse(store.get('studios') || '{}');        // slug -> {n, at, c: [[id, start, name, booked, cap]], t}
let cat = store.get('cat') || '';  // Studios category filter
let studio = null, query = '', asked = {};                     // open studio slug, search text, slug -> time asked

const parseLocal = (s) => { const [d, t] = s.split('T'); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, dd, h, mi); };
const hhmm = (s) => s.slice(11, 16);
const dayKey = (s) => s.slice(0, 10);
const daysFromToday = (s) => {
  const d = parseLocal(s), today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 864e5);
};
const dayHeading = (s) => {
  const d = parseLocal(s), diff = daysFromToday(s), date = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  const id = `d-${dayKey(s)}`;
  if (diff === 0) return `<h2 id="${id}"><span class="today">Today</span><small>${DAYS_LONG[d.getDay()]} · ${date}</small></h2>`;
  if (diff === 1) return `<h2 id="${id}">Tomorrow<small>${DAYS_LONG[d.getDay()]} · ${date}</small></h2>`;
  return `<h2 id="${id}">${DAYS_LONG[d.getDay()]}<small>${date}</small></h2>`;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ICON = {
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  eyeOff: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.2A9.9 9.9 0 0 1 12 5c5 0 9 5 10 7-.5 1-1.7 2.8-3.4 4.3M6.3 6.6C4.3 8 3 10.1 2 12c1 2 5 7 10 7 1.7 0 3.2-.5 4.6-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  eye: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  clash: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
};

// stable colour per studio, so each one is recognisable at a glance
function avatar(name, cls = 'avatar') {
  const PALETTE = [330, 345, 300, 280, 265, 355, 15, 320];  // rose, pink, orchid, lilac, lavender, coral, peach, magenta
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; h = PALETTE[h % PALETTE.length];
  const words = name.replace(/München|Munich|Studio(s)?\b/gi, '').trim().split(/[\s\-–·&]+/).filter(Boolean);
  const ini = ((words[0] || name)[0] + (words[1] ? words[1][0] : (words[0] || '')[1] || '')).toUpperCase();
  return `<div class="${cls}" style="background:linear-gradient(135deg,hsl(${h} 85% 74%),hsl(${(h + 25) % 360} 70% 58%))">${esc(ini)}</div>`;
}

function capacity(booked, cap) {
  const free = cap - booked, pct = cap ? Math.min(100, Math.round((booked / cap) * 100)) : 0;
  const cls = free <= 0 ? 'full' : free <= Math.max(1, Math.round(cap * 0.15)) ? 'low' : '';
  const label = free <= 0 ? 'Full' : `${free} spot${free > 1 ? 's' : ''} left`;
  return `<div class="cap ${cls}"><div class="bar"><i style="width:${pct}%"></i></div><em>${label}</em></div>`;
}

function bookButton(id, booked, cap, bookedIds) {
  if (bookedIds.has(id)) return `<span class="booked">${ICON.check}Booked</span>`;
  const wait = pending[id], free = cap - booked;
  if (wait) return '<button class="btn wait" disabled>Sent…</button>';
  return free > 0 ? `<button class="btn primary" data-book="${id}">Book</button>`
                  : `<button class="btn soft" data-book="${id}">Waitlist</button>`;
}

function classCard({ id, start, name, sub = '', booked, cap, bookedIds, extra = '', dim = false, side = '' }) {
  return `<div class="card${dim ? ' dim' : ''}" data-open="${id}">
    <div class="when"><b>${hhmm(start)}</b></div>
    <div class="body"><div class="title">${esc(name)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
      ${capacity(booked, cap)}${extra}</div>
    <div class="side">${bookButton(id, booked, cap, bookedIds)}${side}</div>
  </div>`;
}

// chips to jump to a day; headings get ids so the chip can scroll to them
function dayChips(starts) {
  const days = [...new Set(starts.map(dayKey))];
  if (days.length < 2) return '';
  return `<div class="days">${days.map((k) => {
    const d = parseLocal(k + 'T12:00'), diff = daysFromToday(k + 'T12:00');
    const label = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : DAYS[d.getDay()];
    return `<button data-day="${k}">${label}<small>${d.getDate()}</small></button>`;
  }).join('')}</div>`;
}
const upcoming = (start) => parseLocal(start) > new Date(Date.now() - 5 * 60000);  // hide classes that already began

function empty(icon, title, text) {
  return `<div class="empty"><div class="big">${icon}</div><b>${title}</b>${text}</div>`;
}

// bottom sheet: resolves with the value of the pressed button (or null when dismissed)
let sheetDone = null;
function sheet({ icon = '', title, lead = '', facts = [], fine = '', html = '', buttons, titleClass = '' }) {
  const el = $('#sheet'), scrim = $('#scrim');
  if (sheetDone) sheetDone(null);
  el.innerHTML = `<button class="sheet-x" data-x="1" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="grab"></div>${icon}<h4 class="${titleClass}">${title}</h4>${lead ? `<p class="lead">${lead}</p>` : ''}
    ${facts.length ? `<div class="facts">${facts.map(([k, v]) => `<div class="fact"><span>${k}</span><b>${v}</b></div>`).join('')}</div>` : ''}
    ${html}
    ${fine ? `<p class="fine">${fine}</p>` : ''}
    <div class="buttons">${buttons.map((b, i) => `<button class="btn ${b.style || 'wait'}" data-sheet="${i}">${b.label}</button>`).join('')}</div>`;
  el.hidden = scrim.hidden = false; el.scrollTop = 0;
  requestAnimationFrame(() => { el.classList.add('show'); scrim.classList.add('show'); });
  return new Promise((resolve) => {
    sheetDone = (v) => {
      sheetDone = null;
      el.classList.remove('show'); scrim.classList.remove('show');
      setTimeout(() => { if (!sheetDone) el.hidden = scrim.hidden = true; }, 320);
      resolve(v);
    };
    el.onclick = (e) => {
      if (e.target.closest('[data-x]')) return sheetDone(null);
      const rt = e.target.closest('[data-retry]');
      if (rt) { (showDetails.asked ||= {})[rt.dataset.retry] = 0; return showDetails(rt.dataset.retry); }
      const b = e.target.closest('[data-sheet]'); if (b) sheetDone(buttons[+b.dataset.sheet].value);
    };
    scrim.onclick = () => sheetDone && sheetDone(null);
  });
}
const BIG = {
  ok: '<div class="badge-icon ok"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>',
  bad: '<div class="badge-icon bad"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></div>',
  ask: '<div class="badge-icon ask"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>',
};
const longDate = (s) => { const d = parseLocal(s); return `${DAYS_LONG[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; };

// everything the app knows about a class id, wherever it was listed
function findClass(id) {
  for (const r of snap?.spots || []) if (r[0] === id) return { name: r[1], start: r[2], gym: 'Session München', booked: r[3], cap: r[4], surcharge: true };
  for (const r of [...(snap?.specials || []), ...bundleSpecials]) if (r[0] === id) return { name: r[3], start: r[1], gym: r[2], booked: r[4], cap: r[5] };
  for (const [slug, st] of Object.entries(studios)) for (const r of st.c) if (r[0] === id) {
    const gym = (favs?.g.find((f) => f[0] === slug) || [, st.n])[1];
    return { name: r[2].replace(' (+€)', ''), start: r[1], gym, booked: r[3], cap: r[4], surcharge: r[2].includes('(+€)') };
  }
  return null;
}
const awaiting = {};
const details = {};    // class id -> full info from the VM
const trips = {};      // class id -> travel times from home / work
let openDetail = null; // class id whose details sheet is showing

// Descriptions come as plain text or as studio HTML: keep only harmless formatting, drop the rest
function richDesc(text) {
  if (!/<[a-z][\s\S]*>|&[a-z#0-9]+;/i.test(text)) return `<p class="desc">${esc(text)}</p>`;
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const KEEP = { P: 'p', BR: 'br', STRONG: 'strong', B: 'strong', EM: 'em', I: 'em', UL: 'ul', OL: 'ol', LI: 'li', DIV: 'p', H1: 'p', H2: 'p', H3: 'p', H4: 'p' };
  const walk = (node) => [...node.childNodes].map((n) => {
    if (n.nodeType === 3) {
      const t = n.textContent;
      return /^\s*[-–—_=*]{5,}\s*$/.test(t) ? '<hr>' : esc(t);
    }
    if (n.nodeType !== 1) return '';
    const tag = KEEP[n.tagName], inner = walk(n);
    if (tag === 'br') return '<br>';
    if (tag === 'p' && /^\s*<hr>\s*$/.test(inner)) return '<hr>';
    return tag ? `<${tag}>${inner}</${tag}>` : inner;
  }).join('');
  return `<div class="desc rich">${walk(doc.body)}</div>`;
}

function showDetails(id, bid) {
  openDetail = id;
  const c = findClass(id) || {};
  const mineRow = (snap?.mine || []).find((m) => m[1] === id);
  const d = details[id];
  const name = d?.n || c.name || mineRow?.[3] || 'Class';
  const start = d?.s || c.start || mineRow?.[2] || '';
  const gym = d?.g || c.gym || mineRow?.[4] || '';
  const booked = d ? d.b : c.booked, cap = d ? d.c : c.cap;
  const facts = [];
  if (start) facts.push(['When', `${longDate(start)} · ${hhmm(start)}${d?.e ? '–' + d.e : ''}`]);
  if (gym) facts.push(['Studio', esc(gym)]);
  if (d?.a) facts.push(['Address', esc(d.a)]);
  if (d?.r) facts.push(['Room', esc(d.r)]);
  if (d?.i) facts.push(['Instructor', esc(d.i)]);
  if (cap) facts.push(['Spots', cap - booked > 0 ? `${cap - booked} of ${cap} left` : `Full${d?.w ? ` · waitlist ${d.w}` : ''}`]);
  if (c.surcharge || /surcharge|\+\s*10\s*€|\+€/i.test(name + (d?.d || ''))) facts.push(['Price', '+10 € Wellpass surcharge']);
  const desc = d ? (d.err ? '<p class="desc muted">Couldn’t load the description.</p>' : d.d ? richDesc(d.d) : '<p class="desc muted">No description for this class.</p>')
                 : '<p class="desc muted"><span class="spinner"></span>Loading details…</p>';
  const tr = trips[id];
  const LABEL = { home: '🏠 Home', work: '💼 Work' };
  const ICONS = { UBAHN: '🚇', BUS: '🚌', REGIONAL: '🚌', TRAM: '🚊', SBAHN: '🚆', BAHN: '🚆' };
  // the VM's previous version sent one connection as [min, dep, "lines"]: show it too
  const conns = (pt) => !Array.isArray(pt) || !pt.length ? [] : typeof pt[0] === 'number'
    ? [[pt[0], pt[1], '', String(pt[2] || '').split(' → ').map((l) => [/^U/.test(l) ? 'UBAHN' : /^S/.test(l) ? 'SBAHN' : /^\d{1,2}$/.test(l) && +l < 40 ? 'TRAM' : 'BUS', l])]]
    : pt;
  const conn = (c) => `<div class="conn"><span class="t">${c[2] ? `${c[1]} → ${c[2]}` : `Leave ${c[1]}`}</span><span class="lines">${c[3].map((l) =>
      `<span class="ln ${esc(l[0])}">${ICONS[l[0]] || ''}${esc(l[1])}</span>`).join('<span class="arrow">›</span>')}</span><span class="m">${c[0]} min</span></div>`;
  const trip = tr ? `<div class="trip"><h6>Getting there</h6>${Object.entries(tr).map(([who, t]) => `
      <div class="from"><div class="head">${LABEL[who] || esc(who)}${t.foot ? `<span>🚶‍♀️ ${t.foot} min walk</span>` : ''}</div>
        ${conns(t.pt).length ? conns(t.pt).map(conn).join('') : '<div class="conn"><span class="t">No connection found</span></div>'}</div>`).join('')}</div>`
    : !d ? ''
    : Date.now() - (showDetails.asked?.[id] || 0) < 45000
      ? '<div class="trip"><h6>Getting there</h6><div class="from"><span class="spinner"></span><span style="color:var(--muted);font-size:13px">Checking routes…</span></div></div>'
      : `<div class="trip"><h6>Getting there</h6><div class="from" style="display:flex;justify-content:space-between;align-items:center">
           <span style="color:var(--muted);font-size:13px">Couldn’t load routes</span><button class="btn soft" data-retry="${id}" style="min-width:0;padding:6px 12px">Retry</button></div></div>`;
  const isMine = !!mineRow;
  const buttons = [{ label: 'Close', value: null }];
  if (isMine) buttons.push({ label: 'Cancel booking', value: 'cancel', style: 'soft' });
  else if (cap && !pending[id]) buttons.push({ label: cap - booked > 0 ? 'Book' : 'Join waitlist', value: 'book', style: 'primary' });
  sheet({ title: esc(name), titleClass: 'full-title', facts, html: trip + desc, buttons }).then((v) => {
    if (openDetail === id) openDetail = null;
    if (v === 'book') confirmBook(id);
    if (v === 'cancel') confirmCancel(mineRow[0]);
  });
  const asked = (showDetails.asked ||= {});
  if ((!d || !tr) && (!asked[id] || Date.now() - asked[id] > 30000)) {
    asked[id] = Date.now(); send(`detail ${id}`, null);
    pollFor(id, Math.floor(asked[id] / 1000) - 5);
    setTimeout(() => { if (openDetail === id && !trips[id]) showDetails(id); }, 45500);
  }
}
  // class/booking id -> what to show when the VM's answer arrives

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms);
}

async function send(cmd, label) {
  try {
    const r = await fetch(`${NTFY}/${cfg.r}`, { method: 'POST', body: cmd });
    if (!r.ok) throw new Error(r.status);
    if (label) toast(label);
  } catch (e) {
    toast('Couldn’t send. Are you online?');
  }
}

function setStatus() {
  const el = $('#status'), txt = $('#statusText');
  if (!snap) { el.className = 'eyebrow'; txt.textContent = 'Connecting…'; return; }
  const age = (Date.now() - parseLocal(snap.at)) / 6e4;
  el.className = 'eyebrow' + (age < 20 ? ' live' : '');
  txt.textContent = 'Updated ' + (age < 1 ? 'just now' : age < 60 ? `${Math.round(age)} min ago` : Math.round(age / 60) + ' h ago');
}

function render() {
  setStatus();
  store.set('lastTab', JSON.stringify({ tab: tab === 'gym' ? 'studios' : tab, at: Date.now() }));
  const main = $('#main');
  const navTab = tab === 'gym' ? 'studios' : tab;
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === navTab ? 'page' : 'false'));
  const mine = snap?.mine || [];
  const mc = $('#mineCount'); mc.hidden = !mine.length; mc.textContent = mine.length;

  if (!cfg.d || !cfg.r) return renderSetup(main);
  if (!snap) { main.innerHTML = empty('<span class="spinner" style="width:28px;height:28px;border-width:3px"></span>', 'Loading', 'If it takes a while, tap ↻.'); return; }

  const bookedIds = new Set(mine.map((m) => m[1]));
  if (tab === 'studios') return renderStudios(main, bookedIds);
  if (tab === 'home') return renderHome(main, mine);
  if (tab === 'gym') {
    $('#title').textContent = 'Studios';

const CATS = [
  ['Red Light Pilates', /red\s*light/i],
  ['Hot Pilates', /(hot|inferno|infrared).*pilates|pilates.*\bhot\b/i],
  ['Reformer & Lagree', /reformer|lagree|cadillac|tower|megaformer/i],
  ['Pilates', /pilates/i],
  ['Barre', /barre|ballet/i],
  ['Hot Yoga', /hot.*yoga|yoga.*\bhot\b|bikram/i],
  ['Yoga', /yoga|yin|vinyasa|ashtanga|flow/i],
  ['Cycling', /cycl|spin|ride|bike/i],
  ['Boxing', /box|kickbox|fight|muay/i],
  ['Dance', /dance|salsa|bachata|zumba|twerk|heels|kizomba/i],
  ['Strength & HIIT', /hiit|strength|sculpt|circuit|bootcamp|tabata|core|body|burn|ems|functional/i],
];
const catOf = (name) => (CATS.find(([, rx]) => rx.test(name)) || ['Other'])[0];
function catChips(names) {
  const n = {};
  for (const x of names) { const k = catOf(x); n[k] = (n[k] || 0) + 1; }
  const keys = [...CATS.map((c) => c[0]), 'Other'].filter((k) => n[k]);
  if (!keys.length) return '';
  return `<div class="days cats"><button data-cat="" class="${cat ? '' : 'on'}">All</button>${keys.map((k) =>
    `<button data-cat="${esc(k)}" class="${cat === k ? 'on' : ''}">${esc(k)}<small>${n[k]}</small></button>`).join('')}</div>`;
}

let snapTime = Number(store.get('snapTime') || 0);  // ntfy time of the snapshot we show
function accept(msg, time = 0) {
  try {
    const s = JSON.parse(msg);
    if (s.k === 'favs') { if (!favs || s.at >= favs.at) { favs = s; store.set('favs', JSON.stringify(s)); render(); } return; }
    if (s.k === 'stats') { if (!stats || s.at >= stats.at) { stats = s; store.set('stats', msg); render(); } return; }
    if (s.k === 'evt') return (s.t === 'detail' || s.t === 'travel' || time * 1000 >= snapTime) ? applyEvent(s) : undefined;  // older than the snapshot: already in it
    if (s.k === 'studio') {
      if (!studios[s.s] || s.at >= studios[s.s].at) { studios[s.s] = s; store.set('studios', JSON.stringify(studios)); render(); }
      return;
    }
    if (s.v !== 1) return;
    if (!snap || s.at >= snap.at) {
      snap = s;
      if (time) { snapTime = time * 1000; store.set('snapTime', String(snapTime)); }
      // drop "Sent…" once the VM has had time to act (or the new snapshot shows it done)
      for (const k in pending) if (Date.now() - pending[k] > 25000) delete pending[k];
      store.set('snap', msg);
      render();
    }
  } catch {}
}

// instant result of a Book/Cancel press, sent by the VM before the full snapshot
const seenEvents = new Set();
function applyEvent(e) {
  if (e.t === 'travel') {
    trips[e.id] = e.tr || {};
    if (openDetail === e.id) showDetails(e.id);
    return;
  }
  if (e.t === 'detail') {
    details[e.id] = e;
    if (openDetail === e.id) showDetails(e.id);
    return;
  }
  const key = JSON.stringify(e);
  if (seenEvents.has(key)) return;  // the same event arrives via the live stream and the 12 h history
  seenEvents.add(key);
  if (!snap) return;
  if (e.t === 'booked' && e.s && !snap.mine.some((m) => m[0] === e.bid)) {
    snap.mine.push([e.bid, e.cid, e.s, e.n, e.g, e.st]);
    snap.mine.sort((a, b) => a[2].localeCompare(b[2]));
    if (awaiting[e.cid]) {
      const w = e.st === 'WAITING_LIST';
      sheet({ icon: BIG.ok, title: w ? 'You’re on the waitlist!' : 'Booking confirmed!',
        lead: w ? 'You’ll get a spot automatically if someone cancels 🤞' : 'See you there, queen 💖',
        facts: [['Class', esc(e.n)], ['When', `${longDate(e.s)} · ${hhmm(e.s)}`], ['Studio', esc(e.g)]],
        buttons: [{ label: 'Done', value: true, style: 'primary' }] });
      delete awaiting[e.cid];
    }
    delete pending[e.cid];
  } else if (e.t === 'cancelled') {
    snap.mine = snap.mine.filter((m) => m[0] !== e.bid);
    if (awaiting[e.bid]) {
      sheet({ icon: BIG.ok, title: 'Booking cancelled', lead: 'The spot is free again.', buttons: [{ label: 'Done', value: true, style: 'primary' }] });
      delete awaiting[e.bid];
    }
    delete pending[e.bid];
  } else if (e.t === 'failed') {
    const id = e.cid || e.bid;
    if (awaiting[id]) {
      sheet({ icon: BIG.bad, title: awaiting[id].cancel ? 'Couldn’t cancel' : 'Couldn’t book',
        lead: esc(e.msg || 'Something went wrong — try again.'),
        fine: awaiting[id].cancel ? 'You can still cancel it in the Wellpass app.' : 'The spot may be gone, or you already have a booking at this studio that day (max. 1).',
        buttons: [{ label: 'OK', value: true, style: 'primary' }] });
      delete awaiting[id];
    }
    delete pending[id];
  }
  store.set('snap', JSON.stringify(snap));
  render();
}

async function onMessage(m) {
  if (m.attachment && m.attachment.name === 'bundle.json') {
    if (m.time * 1000 <= Number(store.get('bundleTime') || 0)) return;
    try {
      const b = await fetch(m.attachment.url).then((r) => r.json());
      if (b.k !== 'bundle') return;
      if (!favs || b.at >= favs.at) { favs = { at: b.at, g: b.favs }; store.set('favs', JSON.stringify(favs)); }
      for (const [slug, st] of Object.entries(b.studios)) if (!studios[slug] || st.at >= studios[slug].at) studios[slug] = st;
      store.set('studios', JSON.stringify(studios));
      if (b.specials) { bundleSpecials = b.specials; store.set('bundleSpecials', JSON.stringify(b.specials)); }
      store.set('bundleTime', String(m.time * 1000));
      render();
    } catch {}  // attachments expire after 3 h; the next hourly bundle replaces it
    return;
  }
  if (m.attachment && m.attachment.name === 'studio.json') {  // one studio's 14 days, too big for a message
    try { accept(await fetch(m.attachment.url).then((r) => r.text()), m.time); } catch {}
    return;
  }
  accept(m.message, m.time);
}

async function load() {
  if (!cfg.d) return render();
  try {
    const r = await fetch(`${NTFY}/${cfg.d}/json?poll=1&since=12h`);
    const msgs = (await r.text()).trim().split('\n').filter(Boolean).map((l) => JSON.parse(l)).filter((m) => m.event === 'message');
    for (const m of msgs) await onMessage(m);
    if (!msgs.length) render();
  } catch { render(); }
}

// Fallback for the live stream: while a class sheet waits for the VM, also ask ntfy directly every 3 s
async function pollFor(id, since) {
  for (let i = 0; i < 15 && openDetail === id && !(details[id] && trips[id]); i++) {
    await new Promise((r) => setTimeout(r, 3000));
    try {
      const r = await fetch(`${NTFY}/${cfg.d}/json?poll=1&since=${since}`);
      const msgs = (await r.text()).trim().split('\n').filter(Boolean).map((l) => JSON.parse(l)).filter((m) => m.event === 'message');
      for (const m of msgs) if (!m.attachment) accept(m.message, m.time);
    } catch {}
  }
}

let es;
function live() {
  if (!cfg.d || es) return;
  es = new EventSource(`${NTFY}/${cfg.d}/sse`);
  es.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.event === 'message') onMessage(m); } catch {} };
  es.onerror = () => { es.close(); es = null; setTimeout(live, 5000); };
}

(() => {
  const ptr = $('#ptr'); let y0 = null, pulled = 0;
  document.addEventListener('touchstart', (e) => { y0 = window.scrollY <= 0 && $('#sheet').hidden ? e.touches[0].clientY : null; pulled = 0; }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    pulled = Math.max(0, Math.min(110, e.touches[0].clientY - y0));
    ptr.style.opacity = pulled > 10 ? Math.min(1, pulled / 70) : 0;
    ptr.style.transform = `translateY(${pulled * .6 - 30}px) rotate(${pulled * 3}deg)`;
    ptr.classList.toggle('ready', pulled > 80);
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (y0 !== null && pulled > 80) $('#refresh').click();
    y0 = null; ptr.classList.remove('ready'); ptr.style.opacity = 0; ptr.style.transform = 'translateY(-60px)';
  });
})();

const cached = store.get('snap'); if (cached) accept(cached);
render(); load(); live();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkForUpdate(); if (es) { es.close(); es = null; } load(); live(); } });
checkForUpdate();
setInterval(setStatus, 30000);
</script>
